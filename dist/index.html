`,Lh={overview:"The Smart Hostel Management System employs a hybridized Document Design approach using MongoDB. It leverages atomic updates for fast state changes, strict document validation at the application tier, and strategic indexing to guarantee under 50ms read SLAs across millions of historical operational records.",principles:[{title:"Hybrid Referencing vs. Embedding",description:"Unbounded arrays are strictly avoided. For example, rather than embedding an expanding array of Payments inside the Student document (which triggers document migration overhead and breaches the 16MB document cap), we utilize an independent **Fees** collection with indexed foreign keys. Conversely, bounded high-cohesion data like Guardian info and Room configurations are safely embedded inside parent models."},{title:"ACID Multi-Document Transactions",description:"Critical business transitions, such as Room Allocation, necessitate transactional guarantees. Assigning a student requires creating an Allocation record, decrementing available room bed counters, and changing student occupancy state. These are executed inside a MongoDB Client Session (`session.startTransaction()`) to ensure complete Rollback on failure."},{title:"Polymorphic User Strategy",description:"A centralized `users` collection manages Authentication, storing base credentials, passwords, active roles, and authorization states. The `students` collection links via a 1-to-1 indexed ObjectId reference, separating core identity management from rich operational domain models."},{title:"Index Strategy for Enterprise Scalability",description:"Compound indexes are applied strictly to mirror read queries. For instance, room queries filtering by hostel block, floor, and occupancy status leverage a targeted compound index `{ hostelBlock: 1, floorNumber: 1, status: 1 }`. Partial indexes are utilized for un-allocated states to minimize memory footprint."}]},qo=[{collectionName:"users",modelName:"User",description:"Centralized identity store for authentication, role evaluation, and session tracking.",indexes:["{ email: 1 } (Unique)","{ role: 1, status: 1 }"],fields:[{name:"_id",type:"ObjectId",required:!0,description:"Primary Key."},{name:"email",type:"String",required:!0,unique:!0,validation:"Regex match for standard email patterns",description:"Unique user email login."},{name:"passwordHash",type:"String",required:!0,description:"Bcrypt hashed secret with cost factor 12."},{name:"role",type:"String",required:!0,default:"'Student'",validation:"Enum: ['Admin', 'Warden', 'Student']",description:"RBAC System Role defining permissions."},{name:"firstName",type:"String",required:!0,description:"User's given legal name."},{name:"lastName",type:"String",required:!0,description:"User's family name."},{name:"phone",type:"String",required:!0,description:"Primary contact phone number."},{name:"status",type:"String",required:!0,default:"'Active'",validation:"Enum: ['Active', 'Suspended', 'Pending']",description:"Account state authorization gate."},{name:"lastLogin",type:"Date",required:!1,description:"Timestamp of last validated security access."}],codeSnippet:`import { Schema, model } from 'mongoose';

export const User = model('User', UserSchema);`},{collectionName:"students",modelName:"Student",description:"Extended student profile storing academic identifiers, parent contacts, and emergency information.",indexes:["{ user: 1 } (Unique)","{ enrollmentNumber: 1 } (Unique)","{ currentRoom: 1 }"],fields:[{name:"_id",type:"ObjectId",required:!0,description:"Primary Key."},{name:"user",type:"ObjectId",required:!0,ref:"User",unique:!0,description:"Foreign key tying profile to system credentials."},{name:"enrollmentNumber",type:"String",required:!0,unique:!0,description:"University or institution registration ID."},{name:"course",type:"String",required:!0,description:"Enrolled academic program (e.g. B.Tech CS, MBA)."},{name:"gender",type:"String",required:!0,validation:"Enum: ['Male', 'Female', 'Other']",description:"Used for restricting hostel block mappings."},{name:"dateOfBirth",type:"Date",required:!0,description:"Student's legal birth date."},{name:"address",type:"Object",required:!0,description:"Embedded structure containing street, city, state, zip."},{name:"guardian",type:"Object",required:!0,description:"Embedded sub-document containing parent name, relation, and contact info."},{name:"medicalInfo",type:"Object",required:!1,description:"Embedded data regarding allergies and blood group."},{name:"currentRoom",type:"ObjectId",required:!1,ref:"Room",description:"Direct linkage to currently assigned Room asset."}],codeSnippet:`import { Schema, model } from 'mongoose';

===================================================================================================
                                  COLLECTION RELATIONSHIPS & CONSTRAINTS
===================================================================================================

The data model utilizes highly strict foreign key linkages using Mongoose ObjectIds.

1. USER <---> STUDENT  (One-to-One)
   - Every Student document MUST possess exactly one referenced User ID.
   - The User document stores the cryptographic access secrets and system role.
   - On deletion of a User, a cascading soft-delete triggers to preserve audit histories while revoking active access.

2. STUDENT <---> ROOM  (Many-to-One)
   - A Room holds multiple Students up to its strict \`capacity\` ceiling.
   - The Student document tracks its active placement inside \`currentRoom\`.
   - The Room document manages the aggregate occupancy inside \`currentOccupancy\`.

3. STUDENT <---> ALLOCATION <---> ROOM  (Many-to-Many resolved via Allocation Entity)
   - The Allocation acts as the core join table resolving the many-to-many historical bindings.
   - A single Student can have multiple historical allocations across their academic years, but only ONE \`status: 'Active'\` Allocation at any given time.
   - An Allocation explicitly identifies the target Bed slot (\`bedIdentifier\`).

4. STUDENT <---> COMPLAINT  (One-to-Many)
   - Students can file multiple facility or discipline complaints over time.
   - A Complaint mandates referencing both the Student and the specific Room asset where the defect occurred.

5. STUDENT <---> VISITOR  (One-to-Many)
   - A Student can have multiple external guests log check-ins over the year.
   - Visitors MUST be explicitly approved by an authorized Warden (User entity with role 'Warden').

6. STUDENT <---> FEE  (One-to-Many)
   - The financial interface binds direct ledger line items to the specific Student.
   - Subscriptions for Rent and Mess are generated automatically via scheduled CRON jobs.
